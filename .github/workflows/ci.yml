name: CI

# Runs on every PR and on every push to main. This is the gate that must pass
# before deploy.yml's build-and-push job runs (see deploy.yml).
on:
  pull_request:
  push:
    branches: [main]
  # Lets deploy.yml's `gate` job invoke this workflow directly via `uses:`,
  # so the deploy pipeline re-runs the exact same checks rather than duplicating them.
  workflow_call:

jobs:
  ci:
    name: Lint, typecheck, migration check, build
    runs-on: ubuntu-latest

    # Ephemeral Postgres so `prisma migrate deploy` proves the committed
    # migration history actually applies cleanly, the same shape as the
    # playbook's "ephemeral Postgres/Redis" integration-test service.
    # There is no Redis dependency in this app and no test suite yet, so
    # this job stops at migration validation + build, not test execution.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: helios_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://helios:ci@localhost:5432/helios_ci
      # Build-time only: NEXT_PUBLIC_* vars are inlined into the client bundle.
      # Real values live in repo secrets; CI doesn't need working Supabase/Maps/
      # Resend credentials to lint, typecheck, or produce a build.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate migrations apply cleanly
        run: npm run migrate:deploy

      - name: Build
        run: npm run build
