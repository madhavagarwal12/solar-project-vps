# For a VPS that already runs its own reverse proxy (e.g. Traefik) for other
# apps, and has no domain pointed at Helios yet. Self-contained: Postgres +
# the app only, published directly on a host port, no reverse proxy of its
# own — nothing here touches ports 80/443 or any other stack on the box.
#
# Once a domain exists and this should sit behind Traefik/Caddy instead of a
# raw port, see docker-compose.yml (root, local dev) and docker-compose.yml
# in this directory (VPS + Caddy, staging+prod topology) for that shape.
#
# Usage (from the deploy/ directory):
#   docker compose -f docker-compose.vps.yml --profile tools run --rm migrate
#   docker compose -f docker-compose.vps.yml --profile tools run --rm seed   # optional, demo data only
#   docker compose -f docker-compose.vps.yml up -d
#
# Requires a `.env` file in this directory (compose variables: POSTGRES_PASSWORD,
# NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, APP_PORT, APP_DOMAIN)
# and a `.env.production` file (app runtime secrets) — see DEPLOYMENT.md.
#
# Generate POSTGRES_PASSWORD with `openssl rand -hex 24`, not `-base64` —
# base64 output can contain `+ / =`, which breaks unescaped inside the
# DATABASE_URL connection string built below (Prisma fails with a confusing
# "invalid port number" error that's actually a mis-parsed password).
#
# Full teardown (containers + network + volume, nothing left behind):
#   docker compose -f docker-compose.vps.yml down -v
#
# Traefik routing: the `app` service carries Traefik labels and joins the
# box's existing `app-network` (external, created by the other stack — same
# pattern as this host's other services, e.g. n8n). This is inert until
# APP_DOMAIN resolves to this VPS: Traefik's ACME TLS-ALPN-01 challenge
# (resolver `mytlschallenge`, see its container's --certificatesresolvers.*
# flags) needs the domain to actually point here before it can issue a cert.
# The direct `${APP_PORT}` publish stays alongside it for now — safe to drop
# once the domain is confirmed working, if you'd rather not expose both.

name: helios

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: helios
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://helios:${POSTGRES_PASSWORD}@postgres:5432/helios
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - default
      - app-network
    labels:
      traefik.enable: "true"
      # The app container sits on two networks (default, for postgres; and
      # app-network, for Traefik). Without this label Traefik's docker
      # provider picks an ambiguous IP when building its backend pool — it
      # silently chose the `default` network's IP, which Traefik itself has
      # no route to, so TLS handshakes succeeded but every request hung
      # forever with no response and no error logged anywhere.
      traefik.docker.network: "app-network"
      traefik.http.routers.helios.rule: "Host(`${APP_DOMAIN}`)"
      traefik.http.routers.helios.entrypoints: "web,websecure"
      traefik.http.routers.helios.tls: "true"
      traefik.http.routers.helios.tls.certresolver: "mytlschallenge"
      traefik.http.services.helios.loadbalancer.server.port: "3000"

  # One-off tooling containers, built from the `builder` stage (which has the
  # full node_modules including the prisma/tsx CLIs — the runner stage's
  # standalone output deliberately doesn't). Not started by `up`.
  migrate:
    build:
      context: ..
      target: builder
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      DATABASE_URL: postgresql://helios:${POSTGRES_PASSWORD}@postgres:5432/helios
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    profiles: ["tools"]

  seed:
    build:
      context: ..
      target: builder
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      DATABASE_URL: postgresql://helios:${POSTGRES_PASSWORD}@postgres:5432/helios
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "tsx", "prisma/seed.ts"]
    profiles: ["tools"]

volumes:
  postgres_data:

networks:
  default: {}
  app-network:
    external: true
